[build-system]
requires = [
    "setuptools >= 40.6.0",
    "wheel"
]
build-backend = 'setuptools.build_meta'

[project]
name = 'classic-db-tools'
version = '2.0.2'
authors = [
    {name = "Sergey Variasov", email = "variasov@gmail.com"},
]
description = 'Classic DB tools'
readme = 'README.md'
license = {'file' = 'LICENSE'}
keywords = ['Jinja2', 'SQL', 'Python', 'Template']
classifiers = [
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3 :: Only',
]
requires-python = '>=3.10'
dependencies = [
    'Jinja2~=3.1',
    'frozendict~=2.4.7',
]

[project.urls]
Homepage = "https://github.com/variasov/classic-db-tools"

[tool.setuptools.packages.find]
where = ['sources']
namespaces = true

[project.optional-dependencies]
criteria = [
    "classic-criteria~=0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest~=9.0",
    "psycopg~=3.3",
    "pytest==9.0.2",
]
