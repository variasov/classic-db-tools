[build-system]
requires = [
    "setuptools >= 68.6.0",
    "wheel"
]
build-backend = 'setuptools.build_meta'

[project]
name = 'classic-db-tools'
version = '3.3.0'
authors = [
    {name = "Sergey Variasov", email = "variasov@gmail.com"},
]
description = 'Classic DB tools'
readme = 'README.md'
license = {'file' = 'LICENSE'}
keywords = ['Jinja2', 'SQL', 'Python', 'Template']
classifiers = [
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3 :: Only',
]
requires-python = '>=3.10'
dependencies = [
    'Jinja2~=3.1',
    'frozendict~=2.4',
]


[project.urls]
Homepage = "https://github.com/variasov/classic-db-tools"

[tool.setuptools.packages.find]
where = ['sources']
namespaces = true

[project.optional-dependencies]
criteria = [
    "classic-criteria~=0.1",
]
oracledb = [
    "oracledb~=4.0",
]
cx-oracle = [
    "cx-oracle~=8.3",
]
mysqlclient = [
    "mysqlclient~=2.2",
]
psycopg = [
    "psycopg~=3.3",
]
psycopg2 = [
    "psycopg2~=2.9",
]
pymssql = [
    "pymssql~=2.3",
]
pymysql = [
    "pymysql~=1.2"
]


[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest==9.0.2",
    "classic-criteria==0.2.1",
]
