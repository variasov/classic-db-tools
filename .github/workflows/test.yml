---
name: Tests

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main

jobs:

  test-sqlite:
    name: SQLite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      # Основной набор работает на sqlite3 in-memory; тесты DB-бэкендов
      # проверяются в отдельных джобах ниже (dev-группа ставит psycopg
      # для pyright, поэтому без --ignore тесты PostgreSQL падали бы
      # здесь без сервера)
      - name: Run tests
        run: uv run pytest tests/ -v --ignore=tests/backends

      - name: Run sqlite3 backend tests
        run: uv run pytest tests/backends/test_sqlite3.py -v


  test-postgresql:
    name: PostgreSQL / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: test
      PGPASSWORD: test
      PGDBNAME: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --extra psycopg --extra psycopg2

      - name: Run tests
        run: >-
          uv run pytest
          tests/backends/test_psycopg.py
          tests/backends/test_psycopg2.py
          -v


  test-mysql:
    name: MySQL / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MYSQL_HOST: '127.0.0.1'
      MYSQL_PORT: '3306'
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --extra pymysql --extra mysqlclient

      - name: Run tests
        run: >-
          uv run pytest
          tests/backends/test_pymysql.py
          tests/backends/test_mysqldb.py
          -v


  test-mssql:
    name: MSSQL / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: TestPass123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P TestPass123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s

    env:
      MSSQL_HOST: localhost
      MSSQL_PORT: '1433'
      MSSQL_USER: sa
      MSSQL_PASSWORD: TestPass123!
      MSSQL_DATABASE: master

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --extra pymssql

      - name: Run tests
        run: uv run pytest tests/backends/test_pymssql.py -v


  test-oracle:
    name: Oracle / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: test
          APP_USER: test
          APP_USER_PASSWORD: test
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s
          --shm-size 2g

    env:
      ORACLE_HOST: localhost
      ORACLE_PORT: '1521'
      ORACLE_USER: test
      ORACLE_PASSWORD: test
      ORACLE_SERVICE: FREEPDB1

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # cx-oracle 8.3 существует только для Python <= 3.10 (wheel до cp310,
      # sdist на 3.11+ не собирается). В extra стоит маркер python_version,
      # поэтому sync проходит на всех версиях матрицы.
      - name: Install dependencies
        run: uv sync --group dev --extra oracledb --extra cx-oracle

      # cx_Oracle - thick-драйвер, ему нужен Oracle Instant Client
      # (oracledb работает в thin-режиме, клиент не нужен)
      - name: Install Oracle Instant Client
        if: matrix.python-version == '3.10'
        env:
          IC_URL: >-
            https://download.oracle.com/otn_software/linux/instantclient/2113000/instantclient-basic-linux.x64-21.13.0.0.0dbru.zip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libaio1t64 ||
            sudo apt-get install -y unzip libaio1
          # t64-переход Ubuntu: пакет ставит библиотеку как libaio.so.1t64,
          # а Instant Client ищет libaio.so.1 - добавляем симлинк
          LIBAIO=$(find /usr/lib -name 'libaio.so.1t64' | head -1)
          if [ -n "$LIBAIO" ]; then
            sudo ln -sf "$LIBAIO" "$(dirname "$LIBAIO")/libaio.so.1"
          fi
          curl -sSLo /tmp/instantclient.zip "$IC_URL"
          sudo unzip -o -q /tmp/instantclient.zip -d /opt/oracle
          echo /opt/oracle/instantclient_21_13 |
            sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf
          sudo ldconfig

      - name: Run oracledb tests
        run: uv run pytest tests/backends/test_oracledb.py -v

      # cx_Oracle живет только на Python 3.10: на остальных ногах шаг не
      # запускается вообще - тесты не пропускаются, а не собираются
      - name: Run cx_oracle tests
        if: matrix.python-version == '3.10'
        run: uv run pytest tests/backends/test_cx_oracle.py -v
